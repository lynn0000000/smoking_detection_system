<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時監控 - 吸菸監控系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/monitor.css">
    <style>
        /* 閃爍動畫 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
    </style>
</head>
<body>
    <!--收縮側邊欄按鈕-->
    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </div>
    <!-- 側邊欄 -->
    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-camera-video-off"></i>
            <h5 class="mt-2">吸菸監控系統</h5>
        </div>
        
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html">
                <i class="bi bi-speedometer2"></i> 儀表板
            </a>
            <a class="nav-link" href="cameras.html">
                <i class="bi bi-camera"></i> 攝影機管理
            </a>
            <a class="nav-link active" href="monitor.html">
                <i class="bi bi-display"></i> 即時監控
            </a>
            <a class="nav-link" href="detections.html">
                <i class="bi bi-list-ul"></i> 偵測記錄
            </a>
            <a class="nav-link" href="settings.html">
                <i class="bi bi-gear"></i> 系統設定
            </a>
            <a class="nav-link" href="#" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> 登出
            </a>
        </nav>
    </div>
    
    <!-- 主要內容 -->
    <div class="main-content">
        <h2 class="mb-4"><i class="bi bi-display"></i> 即時監控</h2>
        
        <!-- 攝影機選擇 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-camera"></i> 選擇攝影機</h5>
                <div id="cameraSelector" class="row g-3">
                    <div class="col-12 text-center text-muted">
                        載入中...
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 視訊畫面 -->
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body p-0">
                        <div class="video-container" id="videoContainer">
                            <div id="videoPlaceholder" class="video-placeholder">
                                <i class="bi bi-camera-video-off"></i>
                                <p>請選擇攝影機開始監控</p>
                            </div>
                            <canvas id="displayCanvas"></canvas>
                            <div id="statusIndicator" class="status-indicator status-offline">
                                <i class="bi bi-wifi-off"></i> 離線
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 控制面板 -->
                <div class="control-panel">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <button id="startBtn" class="btn btn-success" onclick="startMonitoring()" disabled>
                                <i class="bi bi-play-fill"></i> 開始監控
                            </button>
                        </div>
                        <div class="col-auto">
                            <button id="stopBtn" class="btn btn-danger" onclick="stopMonitoring()" disabled>
                                <i class="bi bi-stop-fill"></i> 停止監控
                            </button>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-outline-secondary" onclick="takeScreenshot()">
                                <i class="bi bi-camera"></i> 截圖
                            </button>
                        </div>
                        <div class="col-auto ms-auto">
                            <span id="fpsCounter" class="text-muted">FPS: 0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 統計資訊 -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3"><i class="bi bi-graph-up"></i> 即時統計</h5>
                        
                        <div class="stats-box mb-3">
                            <h4 id="frameCount">0</h4>
                            <p>已處理幀數</p>
                        </div>
                        
                        <div class="stats-box mb-3">
                            <h4 id="detectionCount">0</h4>
                            <p>資料庫記錄次數</p>
                        </div>
                        
                        <div class="stats-box mb-3">
                            <h4 id="avgConfidence">0%</h4>
                            <p>平均信心度</p>
                        </div>
                        
                        <!-- 吸菸行為警示框 -->
                        <div id="smokingAlertBox" class="stats-box" style="background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%); border: 2px solid #dc3545; display: none;">
                            <div class="d-flex align-items-center justify-content-center mb-2">
                                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2.5rem;"></i>
                            </div>
                            <h5 class="text-danger mb-2" style="font-weight: bold;">⚠️ 資料存進偵測記錄中</h5>
                            <p class="mb-1 text-muted" style="font-size: 0.9em;">Person ID</p>
                            <h6 id="personIdDisplay" class="text-danger mb-2" style="font-weight: bold;">--</h6>
                            <p class="mb-1 text-muted" style="font-size: 0.9em;">記錄時間</p>
                            <h6 id="lastDetectionTime" class="text-danger mb-0" style="font-weight: bold;">--:--:--</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const API_URL = 'http://localhost:8000';
    const WS_URL = 'ws://localhost:8000';
    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    
    if (!token) {
        window.location.href = 'login.html';
    }
    
    let selectedCamera = null;
    let websocket = null;
    let isMonitoring = false;
    let frameCount = 0;
    let detectionCount = 0;
    let avgConfidence = 0;
    let fpsInterval;
    let latestDetection = null;
    let videoStream = null;
    
    async function loadCameras() {
        try {
            const response = await fetch(`${API_URL}/api/cameras`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.status === 401) {
                alert('登入已過期，請重新登入');
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            
            const cameras = await response.json();
            
            if (!Array.isArray(cameras)) {
                console.error('API 回傳格式錯誤:', cameras);
                displayCameras([]);
                return;
            }
            
            displayCameras(cameras);
        } catch (error) {
            console.error('Error:', error);
            displayCameras([]);
        }
    }
    
    function displayCameras(cameras) {
        const container = document.getElementById('cameraSelector');
        
        if (cameras.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center">
                    <p class="text-muted">沒有可用的攝影機</p>
                    <a href="cameras.html" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> 新增攝影機
                    </a>
                </div>
            `;
            return;
        }
        
        container.innerHTML = cameras.map(camera => `
            <div class="col-md-6 col-lg-4">
                <div class="card camera-select-card" 
                     data-camera-id="${camera.id}"
                     data-camera-name="${camera.camera_name}"
                     data-camera-apikey="${camera.api_key}"
                     data-camera-type="${camera.camera_type}"
                     data-camera-source='${camera.camera_source.replace(/'/g, "&apos;")}'
                     onclick="selectCameraById(${camera.id})">
                    <div class="card-body">
                        <h6 class="card-title">
                            <i class="bi bi-camera"></i> ${camera.camera_name}
                        </h6>
                        <p class="card-text mb-2">
                            <small class="text-muted">
                                <i class="bi bi-tag"></i> ${camera.camera_type.toUpperCase()}<br>
                                <i class="bi bi-geo-alt"></i> ${camera.location || '未設定'}
                            </small>
                        </p>
                        <span class="badge ${camera.is_online ? 'bg-success' : 'bg-secondary'}">
                            <i class="bi bi-${camera.is_online ? 'wifi' : 'wifi-off'}"></i>
                            ${camera.is_online ? '線上' : '離線'}
                        </span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function selectCameraById(id) {
        const card = event.currentTarget;
        
        document.querySelectorAll('.camera-select-card').forEach(c => {
            c.classList.remove('selected');
        });
        
        card.classList.add('selected');
        
        const name = card.getAttribute('data-camera-name');
        const apiKey = card.getAttribute('data-camera-apikey');
        const type = card.getAttribute('data-camera-type');
        const source = card.getAttribute('data-camera-source');
        
        selectedCamera = { id, name, apiKey, type, source };
        
        document.getElementById('startBtn').disabled = false;
        console.log('已選擇攝影機:', selectedCamera);
        
        updateSelectedCameraDisplay(name, type);
    }
    
    function updateSelectedCameraDisplay(name, type) {
        const placeholder = document.getElementById('videoPlaceholder');
        if (placeholder && placeholder.style.display !== 'none') {
            placeholder.innerHTML = `
                <i class="bi bi-camera-video"></i>
                <p class="mt-3"><strong>已選擇：${name}</strong></p>
                <p class="text-muted">類型：${type.toUpperCase()}</p>
                <p class="text-muted">點擊「開始監控」開始</p>
            `;
        }
    }
    
    async function startMonitoring() {
        if (!selectedCamera) {
            alert('請先選擇攝影機');
            return;
        }
        
        if (isMonitoring) {
            console.warn('已在監控中');
            return;
        }
        
        try {
            const wsUrl = `${WS_URL}/ws/upload/${selectedCamera.apiKey}`;
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = () => {
                console.log('✅ WebSocket 已連線');
                isMonitoring = true;
                updateStatus('online');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('videoPlaceholder').style.display = 'none';
                document.getElementById('displayCanvas').style.display = 'block';
                startFpsCounter();
            };

            websocket.onmessage = async (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                    handleServerMessage(data);
                } catch (error) {
                    console.error('❌ JSON 解析失敗:', error);
                }
            };
            
            websocket.onerror = (error) => {
                console.error('❌ WebSocket 錯誤:', error);
            };
            
            websocket.onclose = () => {
                console.log('⚠️ WebSocket 已斷線');
            };
            
            await startVideoCapture();
            
        } catch (error) {
            console.error('啟動監控失敗:', error);
            alert('啟動監控失敗: ' + error.message);
            stopMonitoring();
        }
    }
    
    async function startVideoCapture() {
        try {
            let constraints;
            
            if (selectedCamera) {
                const { type, source } = selectedCamera;
                
                console.log('🎥 攝影機類型:', type);
                console.log('🎥 攝影機來源:', source);
                
                if (type === 'rtsp') {
                    alert('RTSP 串流需要使用後端處理');
                    stopMonitoring();
                    return;
                }
                
                if (type === 'local' || type === 'usb') {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    
                    console.log('📹 當前可用攝影機:', videoDevices.map(d => d.label));
                    
                    let targetDeviceId = null;
                    
                    try {
                        const cameraInfo = JSON.parse(source);
                        const savedLabel = cameraInfo.label;
                        const savedDeviceId = cameraInfo.deviceId;
                        
                        console.log('🔍 尋找攝影機:', savedLabel);
                        
                        const matchedByLabel = videoDevices.find(d => d.label === savedLabel);
                        if (matchedByLabel) {
                            targetDeviceId = matchedByLabel.deviceId;
                            console.log('✅ 透過標籤找到:', matchedByLabel.label);
                        } else {
                            const matchedById = videoDevices.find(d => d.deviceId === savedDeviceId);
                            if (matchedById) {
                                targetDeviceId = matchedById.deviceId;
                                console.log('✅ 透過 ID 找到:', matchedById.label);
                            }
                        }
                        
                    } catch (e) {
                        console.log('⚠️ 舊格式 source，直接使用');
                        targetDeviceId = source;
                    }
                    
                    if (!targetDeviceId) {
                        const retry = confirm(
                            '找不到指定的攝影機裝置！\n\n' +
                            '可能原因：\n' +
                            '1. 裝置已被移除\n' +
                            '2. 裝置正被其他程式使用\n' +
                            '3. 裝置名稱已變更\n\n' +
                            '是否使用預設攝影機？'
                        );
                        
                        if (!retry) {
                            stopMonitoring();
                            return;
                        }
                        
                        if (videoDevices.length > 0) {
                            targetDeviceId = videoDevices[0].deviceId;
                            console.log('⚠️ 使用預設攝影機:', videoDevices[0].label);
                        } else {
                            throw new Error('沒有可用的攝影機裝置');
                        }
                    }
                    
                    constraints = {
                        video: {
                            deviceId: { exact: targetDeviceId },
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };
                } else {
                    constraints = {
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };
                }
            } else {
                constraints = {
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
            }
            
            console.log('📹 攝影機參數:', constraints);
            
            if (!constraints || !constraints.video) {
                throw new Error('攝影機參數設定錯誤');
            }
            
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            console.log('✅ 已啟動攝影機:', track.label);
            console.log('   Device ID:', settings.deviceId);
            
            showNotification(`已啟動: ${track.label}`, 'success');
            
            videoStream = stream;
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = 640;
            captureCanvas.height = 480;
            const captureCtx = captureCanvas.getContext('2d');
            
            const displayCanvas = document.getElementById('displayCanvas');
            displayCanvas.width = 640;
            displayCanvas.height = 480;
            const displayCtx = displayCanvas.getContext('2d');
            
            let isProcessing = false;
            let skippedFrames = 0;
            
            const captureInterval = setInterval(() => {
                if (!isMonitoring) {
                    clearInterval(captureInterval);
                    stream.getTracks().forEach(track => track.stop());
                    console.log('📷 攝影機已停止');
                    return;
                }
                
                if (isProcessing) {
                    skippedFrames++;
                    if (skippedFrames % 10 === 0) {
                        console.log(`⏭️ 已跳過 ${skippedFrames} 幀`);
                    }
                    return;
                }
                
                isProcessing = true;
                
                try {
                    displayCtx.drawImage(video, 0, 0, 640, 480);
                    
                    if (latestDetection && latestDetection.boxes) {
                        drawBoundingBoxes(displayCtx, latestDetection.boxes);
                    }
                    
                    captureCtx.drawImage(video, 0, 0, 640, 480);
                    
                    captureCanvas.toBlob((blob) => {
                        if (!blob) {
                            isProcessing = false;
                            return;
                        }
                        
                        const reader = new FileReader();
                        
                        reader.onerror = () => {
                            console.error('❌ FileReader 錯誤');
                            isProcessing = false;
                        };
                        
                        reader.onloadend = () => {
                            try {
                                const base64data = reader.result.split(',')[1];
                                
                                if (websocket && websocket.readyState === WebSocket.OPEN) {
                                    websocket.send(JSON.stringify({
                                        type: "frame",
                                        data: base64data,
                                        timestamp: new Date().toISOString()
                                    }));
                                    
                                    frameCount++;
                                    document.getElementById('frameCount').textContent = frameCount;
                                    
                                    if (skippedFrames > 0) {
                                        skippedFrames = 0;
                                    }
                                } else {
                                    console.warn('⚠️ WebSocket 未連線');
                                }
                            } catch (error) {
                                console.error('❌ 發送幀錯誤:', error);
                            } finally {
                                isProcessing = false;
                            }
                        };
                        
                        reader.readAsDataURL(blob);
                    }, 'image/jpeg', 0.8);
                    
                } catch (error) {
                    console.error('❌ 捕捉幀錯誤:', error);
                    isProcessing = false;
                }
                
            }, 100);
            
        } catch (error) {
            console.error('❌ 無法存取攝影機:', error);
            
            let errorMsg = '無法存取攝影機\n\n';
            
            if (error.name === 'NotAllowedError') {
                errorMsg += '原因：權限被拒絕\n請在瀏覽器設定中允許攝影機權限';
            } else if (error.name === 'NotFoundError') {
                errorMsg += '原因：找不到攝影機\n請確認攝影機已正確連接';
            } else if (error.name === 'OverconstrainedError') {
                errorMsg += '原因：指定的攝影機不可用\n該裝置可能已被移除或正被其他程式使用\n\n請嘗試：\n1. 重新掃描攝影機\n2. 在攝影機管理中更新此攝影機';
            } else if (error.name === 'NotReadableError') {
                errorMsg += '原因：攝影機正被其他程式使用\n請關閉其他使用攝影機的程式';
            } else {
                errorMsg += '錯誤: ' + error.message;
            }
            
            alert(errorMsg);
            stopMonitoring();
        }
    }
    
    function drawBoundingBoxes(ctx, boxes) {
        boxes.forEach(box => {
            const { x1, y1, x2, y2, confidence, label } = box;
            
            const color = label === 'person' ? '#00ff00' : '#ff0000';
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
            
            ctx.fillStyle = color;
            const text = `${label} ${(confidence * 100).toFixed(0)}%`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x1, y1 - 25, textWidth + 10, 25);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(text, x1 + 5, y1 - 7);
        });
    }
    
    // 🔥 核心修改：處理伺服器訊息
    function handleServerMessage(data) {
        console.log('📨 收到訊息:', data.type);
        
        try {
            const detectionData = data.data || data;
            
            // 更新框框顯示
            if (detectionData.boxes) {
                latestDetection = detectionData;
            }
            
            // 🔥 關鍵：只有在真正存入資料庫時才顯示警報
            if (data.type === 'database_saved' || data.type === 'alert') {
                console.log('💾 資料已存入資料庫!');
                console.log('   Person ID:', detectionData.person_id);
                console.log('   時間:', detectionData.timestamp);
                console.log('   攝影機:', detectionData.camera_name);
                
                // 增加記錄次數
                detectionCount++;
                document.getElementById('detectionCount').textContent = detectionCount;
                
                // 更新 Person ID
                document.getElementById('personIdDisplay').textContent = detectionData.person_id || '--';
                
                // 更新記錄時間
                updateLastDetectionTime();
                
                // 顯示警報
                showEnhancedAlert();
                
                // 顯示通知
                showNotification(
                    `Person ID ${detectionData.person_id} 記錄已存入資料庫`, 
                    'warning'
                );
            }
            
            // 普通偵測結果 (不觸發警報，只更新信心度)
            if (data.type === 'detection_result') {
                const alpha = 0.2;
                if (detectionData.max_confidence !== undefined) {
                    const confPercent = detectionData.max_confidence * 100;
                    avgConfidence = avgConfidence ? 
                        (alpha * confPercent + (1-alpha) * avgConfidence) : 
                        confPercent;
                    document.getElementById('avgConfidence').textContent = 
                        avgConfidence.toFixed(1) + '%';
                }
            }
            
        } catch (error) {
            console.error('❌ handleServerMessage 錯誤:', error);
        }
    }
    
    // 更新最後偵測時間
    function updateLastDetectionTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('zh-TW', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        document.getElementById('lastDetectionTime').textContent = timeString;
    }
    
    // 顯示警報效果
    function showEnhancedAlert() {
        const alertBox = document.getElementById('smokingAlertBox');
        
        // 顯示警示框
        alertBox.style.display = 'block';
        
        // 閃爍效果
        alertBox.style.animation = 'pulse 0.5s ease-in-out 3';
        
        // 3 秒後重置動畫
        setTimeout(() => {
            alertBox.style.animation = '';
        }, 1500);
    }
    
    function stopMonitoring() {
        isMonitoring = false;
        
        if (websocket) {
            websocket.close();
            websocket = null;
        }
        
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        
        // 隱藏警示框
        const alertBox = document.getElementById('smokingAlertBox');
        alertBox.style.display = 'none';
        
        updateStatus('offline');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('videoPlaceholder').style.display = 'flex';
        document.getElementById('displayCanvas').style.display = 'none';
        
        stopFpsCounter();
        latestDetection = null;
        
        console.log('⏹️ 監控已停止');
    }
    
    function updateStatus(status) {
        const indicator = document.getElementById('statusIndicator');
        indicator.className = 'status-indicator';
        
        if (status === 'online') {
            indicator.classList.add('status-online');
            indicator.innerHTML = '<i class="bi bi-wifi"></i> 線上';
        } else if (status === 'connecting') {
            indicator.classList.add('status-connecting');
            indicator.innerHTML = '<i class="bi bi-hourglass-split"></i> 連線中';
        } else {
            indicator.classList.add('status-offline');
            indicator.innerHTML = '<i class="bi bi-wifi-off"></i> 離線';
        }
    }
    
    function startFpsCounter() {
        let lastFrame = frameCount;
        fpsInterval = setInterval(() => {
            const fps = frameCount - lastFrame;
            document.getElementById('fpsCounter').textContent = `FPS: ${fps}`;
            lastFrame = frameCount;
        }, 1000);
    }
    
    function stopFpsCounter() {
        if (fpsInterval) {
            clearInterval(fpsInterval);
            document.getElementById('fpsCounter').textContent = 'FPS: 0';
        }
    }
    
    function takeScreenshot() {
        const canvas = document.getElementById('displayCanvas');
        if (canvas.style.display === 'block') {
            const link = document.createElement('a');
            link.download = `screenshot_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
        } else {
            alert('請先開始監控');
        }
    }
    
    function showNotification(message, type = 'info') {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
        alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.body.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.remove();
        }, 3000);
    }
    
    function logout() {
        stopMonitoring();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
    
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const mainContent = document.querySelector('.main-content');
        const toggleBtn = document.querySelector('.toggle-btn');

        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('collapsed');
        toggleBtn.classList.toggle('collapsed');
    }
    
    loadCameras();
    
    window.addEventListener('beforeunload', (e) => {
        if (isMonitoring) {
            console.log('⚠️ 頁面即將關閉');
        }
    });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
